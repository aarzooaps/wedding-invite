<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meenu ❤️ Ritesh Wedding</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="hero">
  <div class="overlay">
    <h1>Meenu ❤️ Ritesh</h1>
    <p class="subtitle">We Are Getting Married</p>
    <p class="date">24 & 25 April 2026</p>
  </div>
</section>

<section class="details">
  <h2>Wedding Celebration</h2>
  <p class="city">Katghora, Chhattisgarh</p>
  <p class="venue">Gokul Dham Marriage Hall</p>
</section>

<section class="events">

  <div class="event-card">
    <h3>Day 1</h3>
    <p class="event-date">24 April 2026</p>
    <p>Pre Wedding Celebrations</p>
  </div>

  <div class="event-card">
    <h3>Day 2</h3>
    <p class="event-date">25 April 2026</p>
    <p>Wedding Ceremony</p>
  </div>

</section>

<section class="countdown">
  <h2>Countdown to Our Big Day</h2>
  <div id="timer"></div>
</section>

<footer>
  <p>With love ❤️</p>
  <p>Meenu & Ritesh</p>
</footer>

<script src="script.js"></script>
</body>
</html>
